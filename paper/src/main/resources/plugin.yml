name: SurvivalSplit
version: 1.1.0
main: com.agnes.survivalsplit.SurvivalSplitPlugin
api-version: '1.21'
softdepend: [packetevents, KaelorvynGuard]

commands:
  split:
    description: 打开或查看生存服分流身份。
    usage: /split [check|reload]

permissions:
  survivalsplit.admin:
    description: 允许重载 SurvivalSplit 配置。
    default: op
  survivalsplit.modaudit.bypass:
    description: 跳过客户端模组审计。
    default: false
